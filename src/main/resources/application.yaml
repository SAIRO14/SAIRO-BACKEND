spring:
  application:
    name: sairo-backend

  # 스키마 정본은 db/migration 아래 마이그레이션 파일이다.
  # baseline-on-migrate: 테이블이 이미 있는 기존 DB는 V1을 실행하지 않고 기준선만 기록한다.
  #                      비어 있는 DB(테스트 컨테이너 등)에는 V1부터 그대로 적용된다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# 오류 응답의 traceId와 서버 로그를 이어 붙이기 위한 패턴 (TraceIdFilter가 MDC에 넣는다)
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
