name: CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: github.event_name != 'pull_request' || github.base_ref != 'main'

      - name: Build and test
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
        run: ./gradlew build
        env:
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build AMD64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: sairo-backend:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sairo-backend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare deploy bundle
        env:
          BUNDLE_DIR: ${{ runner.temp }}/sairo-deploy-bundle
        run: |
          install -d -m 0755 "$BUNDLE_DIR"
          gzip -1 -c "${{ runner.temp }}/sairo-backend.tar" > "$BUNDLE_DIR/sairo-backend.tar.gz"
          install -m 0755 deploy/deploy-app.sh "$BUNDLE_DIR/deploy-app.sh"
          install -m 0644 deploy/compose.app.yaml deploy/Caddyfile "$BUNDLE_DIR/"
          cd "$BUNDLE_DIR"
          sha256sum sairo-backend.tar.gz deploy-app.sh compose.app.yaml Caddyfile > SHA256SUMS

      - name: Upload deploy artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sairo-backend-${{ github.sha }}
          path: ${{ runner.temp }}/sairo-deploy-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: [self-hosted, Linux, X64, sairo-deploy]
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_URL }}

    steps:
      - name: Check this is still the latest main commit
        id: main_tip
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_sha="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"

          if [[ "$latest_sha" == "$EXPECTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deployment for $EXPECTED_SHA; main is now $latest_sha."
          fi

      - name: Download deploy artifact
        if: steps.main_tip.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sairo-backend-${{ github.sha }}
          path: ${{ runner.temp }}/sairo-deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deploy bundle checksums
        if: steps.main_tip.outputs.deploy == 'true'
        working-directory: ${{ runner.temp }}/sairo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sha256sum --check SHA256SUMS
          chmod 0755 deploy-app.sh

      - name: Deploy and verify health
        if: steps.main_tip.outputs.deploy == 'true'
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          IMAGE_TAG: sairo-backend:${{ github.sha }}
          BUNDLE_DIR: ${{ runner.temp }}/sairo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "$BUNDLE_DIR/deploy-app.sh" \
            "$BUNDLE_DIR/sairo-backend.tar.gz" \
            "$IMAGE_TAG" \
            "$DEPLOY_HEALTH_URL"

      - name: Remove deploy bundle
        if: always()
        env:
          BUNDLE_DIR: ${{ runner.temp }}/sairo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$BUNDLE_DIR"
