name: CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build and test
        run: ./gradlew build
        env:
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build AMD64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: sairo-backend:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sairo-backend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress and checksum image
        working-directory: ${{ runner.temp }}
        run: |
          gzip -1 sairo-backend.tar
          sha256sum sairo-backend.tar.gz > sairo-backend.tar.gz.sha256

      - name: Upload deploy artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sairo-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sairo-backend.tar.gz
            ${{ runner.temp }}/sairo-backend.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: build-image
    runs-on: [self-hosted, Linux, X64, sairo-deploy]
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download deploy artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sairo-backend-${{ github.sha }}
          path: ${{ runner.temp }}/sairo-image

      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/sairo-image
        run: sha256sum --check sairo-backend.tar.gz.sha256

      - name: Deploy and verify health
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          IMAGE_TAG: sairo-backend:${{ github.sha }}
        run: |
          deploy/deploy-app.sh \
            "${{ runner.temp }}/sairo-image/sairo-backend.tar.gz" \
            "$IMAGE_TAG" \
            "$DEPLOY_HEALTH_URL"
